<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>your present</title>
  <meta name="description" content="your present — new designs daily.">
  <link rel="icon" href="assets/logo.png">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <button class="nav-link" data-panel="about">About</button>
    <a class="logo" href="./" aria-label="your present"></a>
    <button class="nav-link" data-panel="contact">Contact</button>
    <button class="close-link" id="close">Close</button>
  </header>

  <main class="scene">
    <div class="rack-wrap" id="rackWrap">
      <div class="rack" id="rack">
        <div class="rod" aria-hidden="true">
        <svg width="0" height="0" style="position:absolute"><defs>
          <linearGradient id="ypPlate" x1="0" x2="1" y1="0" y2=".25"><stop offset="0" stop-color="#a9a9ae"/><stop offset=".18" stop-color="#f6f6f7"/><stop offset=".4" stop-color="#d2d2d6"/><stop offset=".62" stop-color="#fbfbfc"/><stop offset=".85" stop-color="#c4c4c8"/><stop offset="1" stop-color="#8e8e93"/></linearGradient>
          <linearGradient id="ypCup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8a90"/><stop offset=".12" stop-color="#ffffff"/><stop offset=".28" stop-color="#f4f4f6"/><stop offset=".48" stop-color="#a8a8ad"/><stop offset=".7" stop-color="#4e4e54"/><stop offset=".86" stop-color="#8c8c92"/><stop offset=".95" stop-color="#e6e6e9"/><stop offset="1" stop-color="#77777c"/></linearGradient>
          <radialGradient id="ypScrew" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c4c4c9"/><stop offset="1" stop-color="#7c7c82"/></radialGradient>
        </defs></svg>
        <span class="tube"></span>
        <svg class="bracket l" viewBox="0 0 46 92" aria-hidden="true">
          <rect x="2" y="3" width="27" height="86" rx="6" fill="url(#ypPlate)" stroke="rgba(0,0,0,.22)" stroke-width=".8"/>
          <rect x="3.2" y="4.2" width="24.6" height="83.6" rx="5" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".8"/>
          <g><circle cx="15.5" cy="14" r="3.8" fill="url(#ypScrew)" stroke="rgba(0,0,0,.35)" stroke-width=".6"/><path d="M13 14.6h5" stroke="rgba(0,0,0,.45)" stroke-width=".9"/></g>
          <g><circle cx="15.5" cy="78" r="3.8" fill="url(#ypScrew)" stroke="rgba(0,0,0,.35)" stroke-width=".6"/><path d="M13 78.6h5" stroke="rgba(0,0,0,.45)" stroke-width=".9"/></g>
          <rect x="17" y="32" width="29" height="28" rx="3.5" fill="url(#ypCup)" stroke="rgba(0,0,0,.25)" stroke-width=".7"/>
          <rect x="21" y="32" width="2.2" height="28" fill="rgba(255,255,255,.55)"/>
          <rect x="40" y="32" width="1.4" height="28" fill="rgba(0,0,0,.18)"/>
        </svg>
        <svg class="bracket r" viewBox="0 0 46 92" aria-hidden="true">
          <rect x="2" y="3" width="27" height="86" rx="6" fill="url(#ypPlate)" stroke="rgba(0,0,0,.22)" stroke-width=".8"/>
          <rect x="3.2" y="4.2" width="24.6" height="83.6" rx="5" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".8"/>
          <g><circle cx="15.5" cy="14" r="3.8" fill="url(#ypScrew)" stroke="rgba(0,0,0,.35)" stroke-width=".6"/><path d="M13 14.6h5" stroke="rgba(0,0,0,.45)" stroke-width=".9"/></g>
          <g><circle cx="15.5" cy="78" r="3.8" fill="url(#ypScrew)" stroke="rgba(0,0,0,.35)" stroke-width=".6"/><path d="M13 78.6h5" stroke="rgba(0,0,0,.45)" stroke-width=".9"/></g>
          <rect x="17" y="32" width="29" height="28" rx="3.5" fill="url(#ypCup)" stroke="rgba(0,0,0,.25)" stroke-width=".7"/>
          <rect x="21" y="32" width="2.2" height="28" fill="rgba(255,255,255,.55)"/>
          <rect x="40" y="32" width="1.4" height="28" fill="rgba(0,0,0,.18)"/>
        </svg>
      </div>
        <div class="items" id="items"></div>
      </div>
      <p class="hover-label" id="hoverLabel" aria-live="polite"></p>
    </div>

    <section class="detail" id="detail" aria-hidden="true">
      <button class="arrow prev" id="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6M9 12h12" transform="translate(-1.5 0)"/></svg>
      </button>
      <div class="d-stage"><div class="d-item" id="dItem"></div></div>
      <button class="arrow next" id="next" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6M15 12H3" transform="translate(1.5 0)"/></svg>
      </button>
      <div class="d-meta">
        <p class="d-count" id="dCount">01 / 10</p>
        <h2 class="d-name" id="dName"></h2>
      </div>
    </section>

    <div class="cta-row">
      <button class="pill" id="cta">See availability</button>
      <i class="handle" aria-hidden="true"></i>
    </div>
  </main>

  <footer class="marquee" aria-label="Welcome. Your present.">
    <div class="marquee-track" id="marquee"></div>
  </footer>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-card" role="dialog" aria-modal="true">
      <div class="sheet-body" id="sheetBody"></div>
      <button class="pill small" id="sheetClose">Close</button>
    </div>
  </div>

  <template id="panel-about">
    <h3>About</h3>
    <p>your present makes clothes for right now. Every piece starts as a drawing and ends up on this rack.</p>
  </template>
  <template id="panel-contact">
    <h3>Contact</h3>
    <p>Collabs, wholesale or just saying hi — contact details coming soon.</p>
  </template>
  <template id="panel-availability">
    <h3>Availability</h3>
    <p>Sizes S – XL. First drop opening soon. Subscribe to our newsletter to hear first.</p>
  </template>

  <script src="data/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
